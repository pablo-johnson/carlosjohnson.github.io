backend:
  name: github
  repo: pablo-johnson/carlosjohnson.github.io # The repo
  branch: main

# Media files configuration
media_folder: "static/images"
public_folder: "/images"

# i18n configuration
i18n:
  structure: multiple_files
  locales: [de, es]
  default_locale: de
  omit_default_locale_from_filename : true

collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - label: "General Contact Settings"
        name: "general_contact_settings"
        file: "data/site_settings.yml"
        fields:
          - {
              label: "Booking Destination Email",
              name: "booking_email",
              widget: "string",
              hint: "Messages from Contact/Booking form will be sent to this email",
            }
  - name: "homepage"
    label: "Homepage"
    i18n: true
    files:
      - label: "Homepage Hero"
        name: "homepage"
        file: "content/_index.{{locale}}.md"
        i18n: true
        fields:
          - {
              label: "Internal Title",
              name: "title",
              widget: "string",
              i18n: true,
              required: false,
              hint: "Internal page title. It is not displayed in the hero.",
            }
          - {
              label: "Hide Footer",
              name: "hideFooter",
              widget: "hidden",
              default: true,
              i18n: duplicate,
            }
          - label: "Hero"
            name: "home_hero"
            widget: "object"
            i18n: true
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", i18n: true, required: false }
              - { label: "Title", name: "title", widget: "string", i18n: true }
              - {
                  label: "Subtitle",
                  name: "subtitle",
                  widget: "text",
                  i18n: true,
                  required: false,
                  hint: "Max 500 characters.",
                  pattern: ["^[\\s\\S]{0,500}$", "Must be 500 characters or fewer."],
                }
              - {
                  label: "Autoplay Seconds",
                  name: "autoplay_seconds",
                  widget: "number",
                  value_type: "int",
                  min: 3,
                  max: 5,
                  step: 1,
                  default: 4,
                  i18n: duplicate,
                }
              - label: "Slides"
                name: "slides"
                widget: "list"
                i18n: true
                min: 3
                fields:
                  - {
                      label: "Image",
                      name: "image",
                      widget: "image",
                      i18n: duplicate,
                      hint: "Recommended: 1600x2400 px (2:3). Minimum: 1200x1800 px. Vertical portraits work best. Keep the subject centered or slightly to the right, with some safe margin for cover cropping on smaller screens.",
                    }
                  - { label: "Alt Text", name: "alt", widget: "string", i18n: true, required: false }
              - label: "Profile Briefs"
                name: "profiles"
                widget: "list"
                i18n: true
                min: 3
                max: 3
                fields:
                  - { label: "Title", name: "title", widget: "string", i18n: true }
                  - { label: "Brief", name: "brief", widget: "text", i18n: true }
  - name: "pages"
    label: "Pages (Biography, etc.)"
    i18n: true
    files:
      - label: "Biography"
        name: "about"
        file: "content/about.{{locale}}.md" 
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - {
              label: "Friendly URL (slug)",
              name: "slug",
              widget: "string",
              i18n: true,
            }
          - { label: "Content", name: "body", widget: "markdown", i18n: true }
  - name: "multimedia_resources"
    label: "Multimedia / Resources"
    i18n: true
    files:
      - label: "Images Gallery"
        name: "images_gallery"
        file: "content/images/_index.{{locale}}.md"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Subtitle", name: "subtitle", widget: "string", i18n: true, required: false }
          - { label: "Intro Content", name: "body", widget: "markdown", i18n: true, required: false }
          - label: "Gallery Images"
            name: "gallery_items"
            widget: "list"
            i18n: true
            summary: "{{fields.title}}"
            required: false
            hint: "Reorder the list to control the gallery sequence. Disable an image to hide it without deleting it."
            fields:
              - { label: "Show in Gallery", name: "enabled", widget: "boolean", default: true, i18n: duplicate }
              - {
                  label: "Image",
                  name: "image",
                  widget: "image",
                  i18n: duplicate,
                  hint: "Recommended: 1600 px or larger on the long side.",
                }
              - { label: "Title", name: "title", widget: "string", i18n: true }
              - { label: "Description", name: "description", widget: "text", i18n: true, required: false }
              - { label: "Alt Text", name: "alt", widget: "string", i18n: true, required: false }
      - label: "Videos Gallery"
        name: "videos_gallery"
        file: "content/videos/_index.{{locale}}.md"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Subtitle", name: "subtitle", widget: "string", i18n: true, required: false }
          - { label: "Intro Content", name: "body", widget: "markdown", i18n: true, required: false }
          - label: "Gallery Videos"
            name: "gallery_videos"
            widget: "list"
            i18n: true
            summary: "{{fields.title}}"
            required: false
            hint: "Reorder the list to control the gallery sequence. Disable a video to hide it without deleting it."
            fields:
              - { label: "Show in Gallery", name: "enabled", widget: "boolean", default: true, i18n: duplicate }
              - { label: "Title", name: "title", widget: "string", i18n: true }
              - { label: "Publication Date", name: "date", widget: "datetime", i18n: duplicate }
              - { label: "YouTube Video ID (e.g., dQw4w9WgXcQ)", name: "youtube_id", widget: "string", i18n: duplicate }
              - label: "Cover Image (optional)"
                name: "cover"
                widget: "object"
                required: false
                i18n: duplicate
                fields:
                  - {
                      label: "Image",
                      name: "image",
                      widget: "image",
                      required: false,
                      i18n: duplicate,
                    }
              - { label: "Description or Concert Notes", name: "body", widget: "markdown", i18n: true, required: false }
      - label: "Audios Gallery"
        name: "audios_gallery"
        file: "content/audios/_index.{{locale}}.md"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Subtitle", name: "subtitle", widget: "string", i18n: true, required: false }
          - { label: "Intro Content", name: "body", widget: "markdown", i18n: true, required: false }
          - label: "Gallery Images"
            name: "gallery_items"
            widget: "list"
            i18n: true
            summary: "{{fields.title}}"
            required: false
            hint: "Reorder the list to control the gallery sequence. Disable an image to hide it without deleting it."
            fields:
              - { label: "Show in Gallery", name: "enabled", widget: "boolean", default: true, i18n: duplicate }
              - {
                  label: "Image",
                  name: "image",
                  widget: "image",
                  i18n: duplicate,
                  hint: "Recommended: 1600 px or larger on the long side.",
                }
              - { label: "Title", name: "title", widget: "string", i18n: true }
              - { label: "Description", name: "description", widget: "text", i18n: true, required: false }
              - { label: "Alt Text", name: "alt", widget: "string", i18n: true, required: false }
  - name: "concerts_list"
    label: "Concert Schedule - List Page"
    i18n: true
    files:
      - label: "Concert Schedule Settings"
        name: "concerts_list"
        file: "content/concerts/_index.{{locale}}.md"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Subtitle", name: "subtitle", widget: "string", i18n: true, required: false }
          - { label: "Content", name: "body", widget: "markdown", i18n: true, required: false }
  - name: "concerts"
    label: "Concert Schedule / Events"
    folder: "content/concerts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    i18n: true
    fields:
      - { label: "Title", name: "title", widget: "string", i18n: true }
      - { label: "Concert Date & Time", name: "date", widget: "datetime", i18n: duplicate }
      - { label: "City", name: "city", widget: "string", i18n: duplicate }
      - { label: "Concert Hall / Venue", name: "venue", widget: "string", i18n: duplicate }
      - { label: "Repertoire", name: "repertoire", widget: "string", i18n: true }
      - { label: "Flyer Image (optional)", name: "flyer", widget: "image", required: false, i18n: duplicate }
      - { label: "Ticket Link (optional)", name: "ticket_link", widget: "string", required: false, i18n: duplicate, hint: "URL to purchase tickets (e.g., https://example.com/tickets)" }
      - label: "Contact Information (optional)"
        name: "contact"
        widget: "object"
        required: false
        i18n: duplicate
        fields:
          - { label: "Email", name: "email", widget: "string", required: false, i18n: duplicate }
          - { label: "Phone", name: "phone", widget: "string", required: false, i18n: duplicate }
      - { label: "Additional Notes", name: "body", widget: "markdown", i18n: true, required: false }
  - name: "teaching_page"
    label: "Teaching / Docencia"
    i18n: true
    files:
      - label: "Teaching Page"
        name: "teaching"
        file: "content/teaching/_index.{{locale}}.md"
        i18n: true
        fields:
          - { label: "Title", name: "title", widget: "string", i18n: true }
          - { label: "Subtitle", name: "subtitle", widget: "string", i18n: true, required: false }
          - { label: "Intro Content", name: "body", widget: "markdown", i18n: true, required: false }
          - label: "Chair in Germany"
            name: "germany_chair"
            widget: "object"
            i18n: true
            fields:
              - { label: "University Name", name: "university_name", widget: "string", i18n: true }
              - { label: "University URL", name: "university_url", widget: "string", required: false, i18n: duplicate }
              - { label: "Appointment Title", name: "appointment_title", widget: "string", i18n: true }
              - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Admissions Items"
                name: "admissions"
                widget: "list"
                i18n: true
                field: { label: "Admissions Item", name: "item", widget: "string", i18n: true }
              - label: "Audition Items"
                name: "auditions"
                widget: "list"
                i18n: true
                field: { label: "Audition Item", name: "item", widget: "string", i18n: true }
          - label: "Chair in Peru"
            name: "peru_chair"
            widget: "object"
            i18n: true
            fields:
              - { label: "Institution Name", name: "institution_name", widget: "string", i18n: true }
              - { label: "Institution URL", name: "institution_url", widget: "string", required: false, i18n: duplicate }
              - { label: "Appointment Title", name: "appointment_title", widget: "string", i18n: true }
              - { label: "Description", name: "description", widget: "text", i18n: true }
              - label: "Initiatives"
                name: "initiatives"
                widget: "list"
                i18n: true
                field: { label: "Initiative", name: "item", widget: "string", i18n: true }
          - label: "Masterclasses"
            name: "masterclasses"
            widget: "object"
            i18n: true
            fields:
              - { label: "Description", name: "description", widget: "text", i18n: true, required: false }
              - label: "Events"
                name: "events"
                widget: "list"
                i18n: true
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string", i18n: true }
                  - { label: "Date Label", name: "date", widget: "string", i18n: true, required: false }
                  - { label: "Location", name: "location", widget: "string", i18n: true, required: false }
                  - { label: "Details", name: "details", widget: "text", i18n: true, required: false }
                  - { label: "Link", name: "link", widget: "string", i18n: duplicate, required: false }
          - label: "Student Resources"
            name: "resources"
            widget: "object"
            i18n: true
            fields:
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true, i18n: duplicate }
              - { label: "Private Area", name: "private_area", widget: "boolean", default: true, i18n: duplicate }
              - { label: "Description", name: "description", widget: "text", i18n: true, required: false }
              - { label: "Access Note", name: "access_note", widget: "string", i18n: true, required: false }
              - label: "Resource Items"
                name: "items"
                widget: "list"
                i18n: true
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string", i18n: true }
                  - { label: "Description", name: "description", widget: "text", i18n: true, required: false }
                  - { label: "Link", name: "link", widget: "string", i18n: duplicate, required: false }
