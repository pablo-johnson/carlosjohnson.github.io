baseURL = 'https://pablo-johnson.github.io/carlosjohnson.github.io/'
languageCode = 'de-DE'
title = 'Carlos Johnson | Geiger'
theme = 'PaperMod'
canonifyURLs = false
buildFuture = true

# Configuracion Multilingue: Alemán por defecto
defaultContentLanguage = 'de'

[languages]
  [languages.de]
    languageName = 'Deutsch'
    weight = 1
    title = 'Carlos Johnson'
    [languages.de.params]
      description = 'Klassischer Geiger und Dozent'
      [languages.de.params.profileMode]
        enabled = true
        title = "Carlos Johnson"
        subtitle = "Klassischer Geiger | Erster Konzertmeister | Dozent"
        imageUrl = "images/carlos-profile.jpg"
        [[languages.de.params.profileMode.buttons]]
            name = "Biografie"
            url = "about"
        [[languages.de.params.profileMode.buttons]]
            name = "YouTube"
            url = "https://www.youtube.com/channel/UCcTXVBLzRnSgENDAKnYj1-Q"

  [languages.es]
    languageName = 'Español'
    weight = 2
    title = 'Carlos Johnson'
    [languages.es.params]
      description = 'Violinista Clásico y Profesor'
      [languages.es.params.profileMode]
        enabled = true
        title = "Carlos Johnson"
        subtitle = "Violinista Clásico | Primer Concertino | Profesor"
        imageUrl = "images/carlos-profile.jpg"
        [[languages.es.params.profileMode.buttons]]
            name = "Biografía"
            url = "about"
        [[languages.es.params.profileMode.buttons]]
            name = "YouTube"
            url = "https://www.youtube.com/channel/UCcTXVBLzRnSgENDAKnYj1-Q"

[params]
  defaultTheme = 'light'
  ShowShareButtons = false
  ShowReadingTime = false

# --- MENUS ---
[languages.de.menu]
  [[languages.de.menu.main]]
    name = "Biografie"
    url = "about/"
    weight = 1
  [[languages.de.menu.main]]
    name = "Videos"
    url = "videos/"
    weight = 4
  [[languages.de.menu.main]]
    name = "Konzerte"
    url = "concerts/"
    weight = 3
  [[languages.de.menu.main]]
    name = "Lehre"
    url = "teaching/"
    weight = 2
  [[languages.de.menu.main]]
    name = "Kontakt"
    url = "contact/"
    weight = 5

[languages.es.menu]
  [[languages.es.menu.main]]
    name = "Biografía"
    url = "about/"
    weight = 1
  [[languages.es.menu.main]]
    name = "Videos"
    url = "videos/"
    weight = 4
  [[languages.es.menu.main]]
    name = "Conciertos"
    url = "concerts/"
    weight = 3
  [[languages.es.menu.main]]
    name = "Docencia"
    url = "teaching/"
    weight = 2
  [[languages.es.menu.main]]
    name = "Contacto"
    url = "contact/"
    weight = 5

[params.profileMode]
    enabled = true
    title = "Carlos Johnson"
    subtitle = "Klassischer Geiger | Erster Konzertmeister | Dozent"
    imageUrl = "images/carlos-profile.jpg"
    imageTitle = "Carlos Johnson"
    imageWidth = 150
    imageHeight = 150
    [[params.profileMode.buttons]]
        name = "Biografie"
